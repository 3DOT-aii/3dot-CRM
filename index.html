<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3DOT.ai CRM</title>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<style>
:root{--bg:#f6f7f5;--card:#fff;--ink:#16211b;--mute:#6a766e;--line:#dfe4e0;--acc:#1f6b4a;--accink:#fff;--warn:#b3261e;--won:#1f6b4a;--lost:#8a8f8c;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101512;--card:#18201b;--ink:#e8efe9;--mute:#93a198;--line:#2a352e;--acc:#4cc38a;--accink:#08130d;--warn:#ff8a80}}
:root[data-theme="dark"]{--bg:#101512;--card:#18201b;--ink:#e8efe9;--mute:#93a198;--line:#2a352e;--acc:#4cc38a;--accink:#08130d;--warn:#ff8a80}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
h1{font-size:18px;margin:0;margin-right:auto}
h1 span{color:var(--acc)}
input,select,textarea,button{font:inherit;color:inherit}
input,select,textarea{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
#q{width:200px}
button{cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 12px}
button.p{background:var(--acc);color:var(--accink);border-color:var(--acc);font-weight:600}
button.d{color:var(--warn)}
.stats{display:flex;gap:12px;flex-wrap:wrap;padding:14px 20px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;min-width:130px}
.stat b{display:block;font-size:20px}
.stat small{color:var(--mute)}
.board{display:flex;gap:12px;padding:0 20px 24px;overflow-x:auto;align-items:flex-start}
.col{flex:0 0 240px;background:color-mix(in srgb,var(--card) 55%,var(--bg));border:1px solid var(--line);border-radius:12px;padding:10px}
.col h2{font-size:13px;margin:2px 4px 10px;display:flex;justify-content:space-between;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
.lead{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;cursor:pointer}
.lead b{display:block}
.meta{color:var(--mute);font-size:13px;margin-top:2px}
.tag{display:inline-block;font-size:12px;border:1px solid var(--line);border-radius:99px;padding:1px 8px;margin-top:6px;margin-right:4px}
.over{color:var(--warn);border-color:var(--warn)}
.mv{display:flex;justify-content:space-between;margin-top:8px}
.mv button{padding:2px 10px}
.empty{color:var(--mute);font-size:13px;padding:6px 4px}
#banner{display:none;margin:14px 20px;padding:12px;border:1px solid var(--warn);border-radius:10px;color:var(--warn)}
#modal,.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
#modal .box,.ov .box{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:18px;width:100%;max-width:440px;max-height:92vh;overflow:auto}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
.row{display:flex;gap:10px}.row>div{flex:1}
.dl{width:100%;margin-top:8px;padding:4px 10px;font-size:13px}
.acts{display:flex;gap:8px;margin-top:16px}.acts .sp{margin-right:auto}
img.logo{height:30px;display:block}
.tabs{display:flex;gap:6px}
.tabs button.on{background:var(--acc);color:var(--accink);border-color:var(--acc);font-weight:600}
.ov{display:none}
.laugh{position:fixed;top:-60px;pointer-events:none;z-index:60;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(calc(100vh + 120px)) rotate(var(--r));opacity:.9}}
.view{display:none}.view.on{display:block}
.wrap{padding:16px 20px 28px;max-width:900px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.day{font-size:13px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em;margin:18px 2px 8px}
.note{display:flex;gap:10px;justify-content:space-between;align-items:flex-start}
.note p{margin:4px 0 0;white-space:pre-wrap}
.x{border:1px solid var(--line);background:none;color:var(--warn);padding:2px 10px;font-size:13px}
.todos{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.todos h2{font-size:15px;margin:0 0 10px}
.td{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.td input[type=checkbox]{width:auto}
.td span{flex:1}.td.done span{text-decoration:line-through;color:var(--mute)}
.addrow{display:flex;gap:8px;margin-bottom:8px}
#login{position:fixed;inset:0;background:var(--bg);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
#login .box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;width:100%;max-width:340px}
#login img{height:40px;display:block;margin:0 auto 10px}
#login h2{text-align:center;margin:0 0 6px;font-size:18px}
#login #l_err{color:var(--warn);font-size:13px;min-height:18px;margin-top:8px}
#login button{width:100%;margin-top:12px}
</style>
</head>

  <h1>3DOT<span>.ai</span> CRM</h1>
  <div class="tabs"><button data-tab="pipe" class="on">Pipeline</button><button data-tab="notes">Daily notes</button><button data-tab="todo">To-do</button><button data-tab="partners">Partners</button><button data-tab="projects">Projects</button><button data-tab="jokes">Jokes</button><button data-tab="dict">Dictionary</button></div>
  <input id="q" type="search" placeholder="Search leads">
  <button class="p" id="add">+ Add lead</button>
  <button id="signout">Sign out</button>
</header>
<div id="toast" style="display:none;position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--card);border:1px solid var(--warn);color:var(--warn);padding:10px 14px;border-radius:10px;z-index:50"></div>
<div id="banner">Couldn’t reach the database. Check your internet and refresh.</div>
<div class="view on" id="v_pipe"><div class="stats" id="stats"></div>
<div class="board" id="board"></div></div>

<div class="view" id="v_notes"><div class="wrap">
  <div class="card">
    <div class="row"><div><label>Author</label><select id="n_author"></select></div><div><label>Date</label><input id="n_date" type="date"></div></div>
    <label>Note</label><textarea id="n_text" rows="4" placeholder="What happened today, decisions, ideas…"></textarea>
    <div class="acts"><span class="sp"></span><button class="p" id="n_add">Add note</button></div>
  </div>
  <div id="n_list"></div>
</div></div>

<div class="view" id="v_partners"><div class="wrap">
  <div class="stats" id="p_stats" style="padding:0 0 12px"></div>
  <div class="addrow"><select id="p_filter" style="max-width:180px"></select><select id="p_filter2" style="max-width:220px"></select><span style="flex:1"></span><button class="p" id="p_add">+ Add partner</button></div>
  <div id="p_list"></div>
</div></div>

<div class="view" id="v_projects"><div class="wrap">
  <div class="addrow"><select id="j_filter" style="max-width:180px"></select><span style="flex:1"></span><button class="p" id="j_add">+ Add project</button></div>
  <div id="j_list"></div>
</div></div>

<div class="view" id="v_jokes"><div class="wrap">
  <div class="card">
    <div class="row"><div><label>Who’s joking?</label><select id="k_author"></select></div></div>
    <label>Joke</label><textarea id="k_text" rows="3" placeholder="Business jokes, one-liners, inside jokes…"></textarea>
    <div class="acts"><button id="k_rand">Random joke</button><span class="sp"></span><button class="p" id="k_add">Post joke</button></div>
  </div>
  <div id="k_pick" class="card" style="display:none;font-size:17px"></div>
  <div id="k_list"></div>
</div></div>

<div class="view" id="v_dict"><div class="wrap">
  <div class="card">
    <label>Term</label><input id="d_term" placeholder="e.g. LSA, Gatekeeper Protocol, Cat 3 water">
    <label>Meaning</label><textarea id="d_def" rows="3"></textarea>
    <div class="acts"><button id="d_cancel" style="display:none">Cancel edit</button><span class="sp"></span><button class="p" id="d_save">Add term</button></div>
  </div>
  <input id="d_q" type="search" placeholder="Search the dictionary" style="margin-bottom:12px">
  <div id="d_list"></div>
</div></div>

<div class="view" id="v_todo"><div class="wrap"><div class="todos" id="t_cols"></div></div></div>

<div id="modal"><div class="box">
  <label>Business</label><input id="f_name">
  <div class="row"><div><label>Contact</label><input id="f_contact"></div><div><label>Phone / email</label><input id="f_reach"></div></div>
  <div class="row"><div><label>Stage</label><select id="f_stage"></select></div><div><label>Source</label><select id="f_source"></select></div></div>
  <div class="row"><div><label>Owner</label><select id="f_owner"></select></div><div><label>Value ($/mo)</label><input id="f_value" type="number" min="0"></div></div>
  <label>Next follow-up</label><input id="f_follow" type="date">
  <label>Notes</label><textarea id="f_notes" rows="4"></textarea>
  <div class="acts"><button class="d" id="del">Delete</button><span class="sp"></span><button id="cancel">Cancel</button><button class="p" id="save">Save</button></div>
</div></div>

<div id="pmodal" class="ov"><div class="box">
  <div class="row"><div><label>Name</label><input id="p_name"></div><div><label>Company</label><input id="p_co"></div></div>
  <div class="row"><div><label>Type</label><select id="p_type"></select></div><div><label>Tier</label><select id="p_tier"><option>1</option><option>2</option></select></div></div>
  <label>Matched with (client business)</label><input id="p_match" list="p_matches" placeholder="e.g. WINMAR South Shore"><datalist id="p_matches"></datalist>
  <div class="row"><div><label>Phone / email</label><input id="p_reach"></div><div><label>Owner</label><select id="p_owner"></select></div></div>
  <div class="row"><div><label>Last contact</label><input id="p_last" type="date"></div><div><label>Jobs sent</label><input id="p_jobs" type="number" min="0"></div></div>
  <label>Notes</label><textarea id="p_notes" rows="3"></textarea>
  <div class="acts"><button class="d" id="p_del">Delete</button><span class="sp"></span><button id="p_cancel">Cancel</button><button class="p" id="p_save">Save</button></div>
</div></div>
<div id="jmodal" class="ov"><div class="box">
  <label>Project</label><input id="j_name">
  <div class="row"><div><label>Owner</label><select id="j_owner"></select></div><div><label>Status</label><select id="j_status"></select></div></div>
  <label>Due date</label><input id="j_due" type="date">
  <label>Next step</label><input id="j_next" placeholder="What’s the very next thing to do?">
  <label>Notes</label><textarea id="j_notes" rows="4"></textarea>
  <div class="acts"><button class="d" id="j_del">Delete</button><span class="sp"></span><button id="j_cancel">Cancel</button><button class="p" id="j_save">Save</button></div>
</div></div>
<script>
var STAGES=["New","Contacted","Call booked","Proposal sent","Won","Lost"];
var SOURCES=["Meta ad","Referral","Cold DM","Cold call","Other"];
var OWNERS=["Ken","Alex"];
var leads=[],editId=null,coll=null,query="";
var $=function(i){return document.getElementById(i)};
function toast(m){var t=$("toast");t.textContent=m;t.style.display="block";setTimeout(function(){t.style.display="none"},3000)}
function arm(btn,fn){
  if(btn.dataset.armed){btn.dataset.armed="";fn();return}
  var old=btn.textContent;btn.dataset.armed="1";btn.textContent="Click again to confirm";
  setTimeout(function(){btn.dataset.armed="";btn.textContent=old},3000);
}
function fill(id,arr){$(id).innerHTML=arr.map(function(x){return "<option>"+x+"</option>"}).join("")}
fill("f_stage",STAGES);fill("f_source",SOURCES);fill("f_owner",OWNERS);
function esc(s){var d=document.createElement("div");d.textContent=s==null?"":String(s);return d.innerHTML}
function today(){return new Date().toISOString().slice(0,10)}
function money(n){return "$"+(Number(n)||0).toLocaleString("en-US")}

function render(){
  var t=today(),ql=query.toLowerCase();
  var list=leads.filter(function(l){return !ql||[l.name,l.contact,l.notes,l.source,l.owner].join(" ").toLowerCase().indexOf(ql)>-1});
  var open=leads.filter(function(l){return l.stage!=="Won"&&l.stage!=="Lost"});
  var due=open.filter(function(l){return l.follow&&l.follow<=t}).length;
  var won=leads.filter(function(l){return l.stage==="Won"}).reduce(function(a,l){return a+(Number(l.value)||0)},0);
  var pipe=open.reduce(function(a,l){return a+(Number(l.value)||0)},0);
  $("stats").innerHTML=[[open.length,"Open leads"],[money(pipe),"Open pipeline /mo"],[money(won),"Won /mo"],[due,"Follow-ups due"]]
    .map(function(s){return '<div class="stat"><b>'+s[0]+'</b><small>'+s[1]+'</small></div>'}).join("");
  $("board").innerHTML=STAGES.map(function(st,i){
    var items=list.filter(function(l){return l.stage===st});
    return '<div class="col"><h2><span>'+st+'</span><span>'+items.length+'</span></h2>'+
      (items.length?items.map(function(l){
        var od=l.follow&&l.follow<=t&&st!=="Won"&&st!=="Lost";
        return '<div class="lead" data-id="'+l.id+'"><b>'+esc(l.name||"Untitled")+'</b>'+
          '<div class="meta">'+esc(l.contact||"")+'</div>'+
          '<span class="tag">'+esc(l.source||"")+'</span>'+
          (l.value?'<span class="tag">'+money(l.value)+'/mo</span>':'')+
          (l.owner?'<span class="tag">'+esc(l.owner)+'</span>':'')+
          (l.follow?'<span class="tag'+(od?' over':'')+'">'+esc(l.follow)+'</span>':'')+
          '<div class="mv"><button data-mv="-1" data-id="'+l.id+'"'+(i===0?' disabled':'')+'>←</button><button data-mv="1" data-id="'+l.id+'"'+(i===STAGES.length-1?' disabled':'')+'>→</button></div></div>';
      }).join(""):'<div class="empty">Nothing here</div>')+'</div>';
  }).join("");
}

function openModal(id){
  editId=id;var l=leads.find(function(x){return x.id===id})||{};
  $("f_name").value=l.name||"";$("f_contact").value=l.contact||"";$("f_reach").value=l.reach||"";
  $("f_stage").value=l.stage||STAGES[0];$("f_source").value=l.source||SOURCES[0];
  $("f_owner").value=l.owner||OWNERS[0];$("f_value").value=l.value||"";
  $("f_follow").value=l.follow||"";$("f_notes").value=l.notes||"";
  $("del").style.display=id?"":"none";
  $("modal").style.display="flex";$("f_name").focus();
}
function closeModal(){$("modal").style.display="none";editId=null}

$("add").onclick=function(){if(coll)openModal(null)};
$("cancel").onclick=closeModal;
$("modal").onclick=function(e){if(e.target===$("modal"))closeModal()};
$("q").oninput=function(e){query=e.target.value;render()};
$("save").onclick=async function(){
  var d={name:$("f_name").value.trim(),contact:$("f_contact").value.trim(),reach:$("f_reach").value.trim(),
    stage:$("f_stage").value,source:$("f_source").value,owner:$("f_owner").value,
    value:Number($("f_value").value)||0,follow:$("f_follow").value,notes:$("f_notes").value};
  if(!d.name){$("f_name").focus();return}
  try{
    if(editId){await coll.doc(editId).update(d)}else{d.created=today();await coll.add(d)}
    closeModal();
  }catch(e){toast("Couldn’t save.")}
};
$("del").onclick=function(){
  if(!editId||!coll)return;var id=editId;
  arm($("del"),async function(){try{await coll.doc(id).delete();closeModal()}catch(e){toast("Couldn’t delete.")}});
};
$("board").onclick=async function(e){
  var dl=e.target.closest("[data-dl]");
  if(dl){e.stopPropagation();if(coll){var did=dl.dataset.dl;arm(dl,async function(){try{await coll.doc(did).delete()}catch(err){toast("Couldn’t delete.")}})}return}
  var mv=e.target.closest("[data-mv]");
  if(mv){
    e.stopPropagation();
    var l=leads.find(function(x){return x.id===mv.dataset.id});if(!l||!coll)return;
    var n=STAGES.indexOf(l.stage)+Number(mv.dataset.mv);
    if(n>=0&&n<STAGES.length){try{await coll.doc(l.id).update({stage:STAGES[n]})}catch(err){toast("Couldn’t move lead.")}}
    return;
  }
  var c=e.target.closest(".lead");if(c)openModal(c.dataset.id);
};

function laughRain(){
  if(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  var box=document.createElement("div");document.body.appendChild(box);
  for(var i=0;i<45;i++){
    var e=document.createElement("span");e.className="laugh";e.textContent="😂";
    var dur=2.2+Math.random()*2.2;
    e.style.left=Math.random()*100+"vw";
    e.style.fontSize=(20+Math.random()*28)+"px";
    e.style.animationDuration=dur+"s";
    e.style.animationDelay=(Math.random()*1.2)+"s";

function listen(name,setter,after){
  var c=db.collection(name);
  unsubs.push(c.onSnapshot(function(sn){
    var arr=sn.docs.map(function(d){var x=Object.assign({},d.data());x.id=d.id;return x});

}

  ncoll=listen("notes",function(a){notes=a},renderNotes);

  unsubs.push(tcoll.onSnapshot(function(sn){

    todos=sn.docs.map(function(d){var x=Object.assign({},d.data());x.id=d.id;return x});
